plugins { id 'com.android.application' }
android {
 namespace 'com.lamggm.rospocket'
 compileSdk 35
 buildFeatures { buildConfig true }
 buildToolsVersion '35.0.0'
 defaultConfig {
  applicationId 'com.lamggm.rospocket.dev'
  minSdk 28
  targetSdk 35
  versionCode 1
  versionName '0.1.0'
 }
 buildTypes { debug { debuggable true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging true } }
 sourceSets { main { assets.srcDirs += rootProject.file('third_party') } }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   if (System.getenv('POCKET_ROBOLECTRIC_JARS')) {
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', System.getenv('POCKET_ROBOLECTRIC_JARS')
   }
  }
 }
 lint { abortOnError true }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
