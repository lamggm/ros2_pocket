name: Verify
on:
  pull_request:
  push:
    branches: [main, integration/v0.2, ci/v0.2-01-reproducible-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize isolated build paths
        run: |
          mkdir -p "$RUNNER_TEMP/pocket-tmp"
          printf 'GRADLE_USER_HOME=%s/pocket-gradle\nPOCKET_TOOLCHAINS=%s/pocket-toolchains\nTMPDIR=%s/pocket-tmp\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Secret scan (full fetched history, redacted, no tokens)
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git --redact --no-banner --log-opts=--all /repo
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Host prerequisites and wrapper integrity
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3 curl unzip
          mkdir -p "$TMPDIR"
          printf '%s  %s\n' cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8 gradle/wrapper/gradle-wrapper.jar | sha256sum --check --strict
      - name: Bootstrap from public upstreams (no private caches)
        run: bash tools/bootstrap.sh --online
      - name: Portable tests, Android unit tests, lint and debug APK
        run: bash tools/build.sh --online
      - name: Isolated Jazzy Fast DDS and Cyclone DDS regressions
        run: bash tools/test.sh --fixture
      - name: Verify warmed offline path
        run: |
          bash tools/bootstrap.sh --offline
          bash tools/build.sh --offline
      - name: Upload debug APK and artifact-derived provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ros-pocket-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/artifacts/app-debug.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
